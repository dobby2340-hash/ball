.form-check-label {

.form-switch .form-check-input {

.form-switch .form-check-input:focus-visible {

    --viz-series-1: rgb(91, 124, 250);
    --viz-series-2: rgb(91, 166, 116);
    --viz-series-3: rgb(233, 138, 58);
    --viz-series-4: rgb(217, 107, 165);
  }

  html,
  body {
    background: rgb(255, 255, 255) !important;
  }
</style>
</head>
<body>
<div id="equivalent-pendulum-3d" class="eqp3d">
  <div class="viz-controls" aria-label="摆动方式与视角控制">
    <button type="button" class="btn" id="eqp3d-in" aria-pressed="false">纸面内摆动</button>
    <button type="button" class="btn" id="eqp3d-out" aria-pressed="true">垂直纸面摆动</button>
    <button type="button" class="btn btn-ghost" id="eqp3d-view">重置视角</button>
  </div>

  <div class="eqp3d-stage" id="eqp3d-stage">
    <canvas id="eqp3d-canvas" role="img" aria-label="三线悬挂小球的可旋转三维摆动模型"></canvas>
    <div class="eqp3d-hint text-small text-muted">拖动旋转 · 滚轮缩放</div>
    <div class="eqp3d-status" aria-live="polite">
      <span class="viz-badge" id="eqp3d-mode">垂直纸面摆动</span>
      <span id="eqp3d-note">先观察结点 O 是否固定</span>
    </div>
  </div>

  <div class="viz-controls eqp3d-bottom">
    <button type="button" class="btn btn-primary" id="eqp3d-next">下一步</button>
    <button type="button" class="btn" id="eqp3d-auto">暂停自动</button>
    <span class="text-small text-muted" id="eqp3d-step">1 / 4</span>
  </div>
</div>

<style>
  #equivalent-pendulum-3d {
    width: 100%;
    color: var(--foreground);
    background: transparent;
  }

  #equivalent-pendulum-3d .eqp3d-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 3;
    min-height: 300px;
    max-height: 620px;
    margin-top: 12px;
    overflow: hidden;
    background: var(--background);
    touch-action: none;
    user-select: none;
  }

  #equivalent-pendulum-3d canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }

  #equivalent-pendulum-3d canvas:active {
    cursor: grabbing;
  }

  #equivalent-pendulum-3d .eqp3d-hint {
    position: absolute;
    top: 12px;
    right: 14px;
    pointer-events: none;
  }

  #equivalent-pendulum-3d .eqp3d-status {
    position: absolute;
    left: 14px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    color: var(--foreground);
    background: color-mix(in srgb, var(--background) 86%, transparent);
    backdrop-filter: blur(8px);
    pointer-events: none;
  }

  #equivalent-pendulum-3d .eqp3d-bottom {
    margin-top: 12px;
  }

  @media (max-width: 520px) {
    #equivalent-pendulum-3d .eqp3d-stage {
      aspect-ratio: 4 / 3;
      min-height: 340px;
    }

    #equivalent-pendulum-3d .eqp3d-status {
      right: 10px;
      left: 10px;
      bottom: 10px;
      flex-wrap: wrap;
    }
  }
</style>

<script>
(() => {
  "use strict";

  const root = document.getElementById("equivalent-pendulum-3d");
  const canvas = document.getElementById("eqp3d-canvas");
  const stage = document.getElementById("eqp3d-stage");
  const ctx = canvas.getContext("2d");
  const inButton = document.getElementById("eqp3d-in");
  const outButton = document.getElementById("eqp3d-out");
  const viewButton = document.getElementById("eqp3d-view");
  const nextButton = document.getElementById("eqp3d-next");
  const autoButton = document.getElementById("eqp3d-auto");
  const modeLabel = document.getElementById("eqp3d-mode");
  const noteLabel = document.getElementById("eqp3d-note");
  const stepLabel = document.getElementById("eqp3d-step");

  if (!root || !canvas || !stage || !ctx || !inButton || !outButton ||
      !viewButton || !nextButton || !autoButton || !modeLabel ||
      !noteLabel || !stepLabel) return;

  const colorProbe = document.createElement("span");
  colorProbe.setAttribute("aria-hidden", "true");
  colorProbe.style.position = "absolute";
  colorProbe.style.width = "0";
  colorProbe.style.height = "0";
  colorProbe.style.overflow = "hidden";
  colorProbe.style.pointerEvents = "none";
  root.appendChild(colorProbe);
  const colorCanvas = document.createElement("canvas");
  const colorContext = colorCanvas.getContext("2d");

  const SQRT3 = Math.sqrt(3);
  const h = SQRT3 / 2;
  const stringLength = 2;
  const pivotX = 0.5;
  const A = [-1, 0, 0];
  const B = [1, 0, 0];
  const OPrime = [pivotX, 0, 0];

  let width = 900;
  let height = 540;
  let dpr = 1;
  let mode = "out";
  let phase = 0;
  let autoRun = true;
  let lastPhaseChange = performance.now();
  let yaw = 0.68;
  let pitch = 0.18;
  let radius = 7.6;
  let dragging = false;
  let pointerId = null;
  let lastX = 0;
  let lastY = 0;
  let lastTime = performance.now();
  let motionTime = 0;

  const notes = {
    in: [
      "先观察结点 O 是否固定",
      "上方三角形不动，O 是固定悬点",
      "小球的轨迹圆心在 O",
      "等效摆长看 OC"
    ],
    out: [
      "先观察结点 O 是否固定",
      "上方三角形绕 AB 轴转动",
      "O 与 C 同绕水平轴 AB 转动",
      "等效摆长看 O′C"
    ]
  };

  let paletteCache = null;

  function normalizeCanvasColor(value, fallback) {
    if (!colorContext) return fallback;
    colorContext.fillStyle = fallback;
    const safeFallback = colorContext.fillStyle;
    colorContext.fillStyle = value;
    return colorContext.fillStyle || safeFallback;
  }

  function cssColor(name, fallback) {
    colorProbe.style.color = fallback;
    colorProbe.style.color = "var(" + name + ", " + fallback + ")";
    const computed = getComputedStyle(colorProbe).color || fallback;
    return normalizeCanvasColor(computed, fallback);
  }

  function palette() {
    if (!paletteCache) {
      paletteCache = {
        bg: cssColor("--background", "#ffffff"),
        fg: cssColor("--foreground", "#1d232f"),
        muted: cssColor("--muted-foreground", "#7b8494"),
        border: cssColor("--border", "#ccd2dc"),
        primary: cssColor("--primary", "#4f7cf7"),
        primaryFg: cssColor("--primary-foreground", "#ffffff"),
        s1: cssColor("--viz-series-1", "#5b7cfa"),
        s2: cssColor("--viz-series-2", "#5ba674"),
        s3: cssColor("--viz-series-3", "#e98a3a"),
        s4: cssColor("--viz-series-4", "#d96ba5")
      };
    }
    return paletteCache;
  }

  function add(a, b) {
    return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  }

  function sub(a, b) {
    return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  }

  function mul(a, s) {
    return [a[0] * s, a[1] * s, a[2] * s];
  }

  function dot(a, b) {
    return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  }

  function cross(a, b) {
    return [
      a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2],
      a[0] * b[1] - a[1] * b[0]
    ];
  }

  function norm(a) {
    const length = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / length, a[1] / length, a[2] / length];
  }

  function camera() {
    const target = [0, -1.35, 0];
    const eye = [
      target[0] + radius * Math.cos(pitch) * Math.sin(yaw),
      target[1] + radius * Math.sin(pitch),
      target[2] + radius * Math.cos(pitch) * Math.cos(yaw)
    ];
    const forward = norm(sub(target, eye));
    const right = norm(cross(forward, [0, 1, 0]));
    const up = norm(cross(right, forward));
    return { eye, forward, right, up, focal: Math.min(width, height) * 1.12 };
  }

  function project(point, cam) {
    const rel = sub(point, cam.eye);
    const depth = dot(rel, cam.forward);
    if (depth < 0.08) return null;
    const scale = cam.focal / depth;
    return {
      x: width * 0.5 + dot(rel, cam.right) * scale,
      y: height * 0.48 - dot(rel, cam.up) * scale,
      depth,
      scale
    };
  }

  function rotateAroundAB(point, angle) {
    const c = Math.cos(angle);
    const s = Math.sin(angle);
    return [point[0], point[1] * c - point[2] * s, point[1] * s + point[2] * c];
  }

  function currentGeometry() {
    const amp = mode === "in" ? 0.38 : 0.31;
    const omega = mode === "in" ? 1.75 : 1.42;
    const angle = amp * Math.sin(motionTime * omega);
    const OBase = [pivotX, -h, 0];
    if (mode === "in") {
      const O = OBase;
      const C = [
        O[0] + stringLength * Math.sin(angle),
        O[1] - stringLength * Math.cos(angle),
        0
      ];
      return { O, C, angle };
    }
    const O = rotateAroundAB(OBase, angle);
    const C = rotateAroundAB([pivotX, -(h + stringLength), 0], angle);
    return { O, C, angle };
  }

  function primitiveDepth(points, cam) {
    let total = 0;
    let count = 0;
    points.forEach((point) => {
      const p = project(point, cam);
      if (p) {
        total += p.depth;
        count += 1;
      }
    });
    return count ? total / count : -Infinity;
  }

  function linePrimitive(a, b, color, lineWidth, alpha, dash) {
    return { kind: "line", a, b, color, lineWidth, alpha, dash: dash || [] };
  }

  function polyPrimitive(points, color, alpha, stroke, lineWidth) {
    return { kind: "poly", points, color, alpha, stroke, lineWidth };
  }

  function spherePrimitive(center, radiusWorld, color, label, labelOffset) {
    return { kind: "sphere", center, radiusWorld, color, label, labelOffset };
  }

  function labelPrimitive(point, text, dx, dy, color, strong) {
    return { kind: "label", point, text, dx, dy, color, strong };
  }

  function drawPrimitive(item, cam) {
    ctx.save();
    if (item.kind === "poly") {
      const points = item.points.map((point) => project(point, cam));
      if (points.some((point) => !point)) {
        ctx.restore();
        return;
      }
      ctx.globalAlpha = item.alpha;
      ctx.fillStyle = item.color;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fill();
      if (item.stroke) {
        ctx.globalAlpha = Math.min(1, item.alpha + 0.22);
        ctx.strokeStyle = item.stroke;
        ctx.lineWidth = item.lineWidth || 1;
        ctx.stroke();
      }
    } else if (item.kind === "line") {
      const a = project(item.a, cam);
      const b = project(item.b, cam);
      if (!a || !b) {
        ctx.restore();
        return;
      }
      ctx.globalAlpha = item.alpha;
      ctx.strokeStyle = item.color;
      ctx.lineWidth = item.lineWidth;
      ctx.lineCap = "round";
      ctx.setLineDash(item.dash);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    } else if (item.kind === "sphere") {
      const center = project(item.center, cam);
      if (!center) {
        ctx.restore();
        return;
      }
      const radiusPx = Math.max(4, item.radiusWorld * center.scale);
      ctx.shadowColor = item.color;
      ctx.shadowBlur = radiusPx * 0.6;
      ctx.fillStyle = item.color;
      ctx.beginPath();
      ctx.arc(center.x, center.y, radiusPx, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = pColor("--primary-foreground", "#ffffff");
      ctx.beginPath();
      ctx.arc(center.x - radiusPx * 0.28, center.y - radiusPx * 0.32, radiusPx * 0.28, 0, Math.PI * 2);
      ctx.fill();
    } else if (item.kind === "label") {
      const point = project(item.point, cam);
      if (!point) {
        ctx.restore();
        return;
      }
      ctx.fillStyle = item.color;
      ctx.font = (item.strong ? "500 " : "400 ") + "16px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(item.text, point.x + item.dx, point.y + item.dy);
    }
    ctx.restore();
  }

  function pColor(name, fallback) {
    const colors = palette();
    if (name === "--primary-foreground") return colors.primaryFg;
    return cssColor(name, fallback);
  }

  function addArc(primitives, points, color, lineWidth, alpha, dash) {
    for (let i = 1; i < points.length; i += 1) {
      primitives.push(linePrimitive(points[i - 1], points[i], color, lineWidth, alpha, dash));
    }
  }

  function draw() {
    const p = palette();
    ctx.clearRect(0, 0, width, height);
    const cam = camera();
    const geometry = currentGeometry();
    const primitives = [];

    const ceiling = [
      [-1.65, 0.08, -0.32],
      [1.65, 0.08, -0.32],
      [1.65, 0.08, 0.32],
      [-1.65, 0.08, 0.32]
    ];
    primitives.push(polyPrimitive(ceiling, p.border, 0.18, p.border, 1));

    const paperPlane = [
      [-1.45, 0.18, 0],
      [1.42, 0.18, 0],
      [1.42, -3.25, 0],
      [-1.45, -3.25, 0]
    ];
    primitives.push(polyPrimitive(paperPlane, p.s2, mode === "in" ? 0.09 : 0.045, p.s2, 1));

    primitives.push(linePrimitive([-1.45, 0, 0], [1.45, 0, 0], p.border, 2, 0.6));
    primitives.push(linePrimitive(A, B, phase >= 1 && mode === "out" ? p.s3 : p.fg, 4, 0.92));

    const triangleAlpha = mode === "out" && phase >= 1 ? 0.16 : 0.07;
    primitives.push(polyPrimitive([A, B, geometry.O], p.s1, triangleAlpha, p.s1, 1.5));
    primitives.push(linePrimitive(A, geometry.O, p.fg, 2.2, 0.78));
    primitives.push(linePrimitive(B, geometry.O, p.fg, 2.2, 0.78));
    primitives.push(linePrimitive(geometry.O, geometry.C, p.fg, 2.8, 0.9));

    if (phase >= 2) {
      const trajectory = [];
      const samples = 60;
      for (let i = 0; i <= samples; i += 1) {
        const a = -0.42 + 0.84 * i / samples;
        if (mode === "in") {
          trajectory.push([
            pivotX + stringLength * Math.sin(a),
            -h - stringLength * Math.cos(a),
            0
          ]);
        } else {
          trajectory.push(rotateAroundAB([pivotX, -(h + stringLength), 0], a));
        }
      }
      addArc(primitives, trajectory, p.s2, 2, 0.66, [5, 6]);
    }

    if (mode === "out" && phase >= 2) {
      primitives.push(spherePrimitive(OPrime, 0.055, p.s3));
      primitives.push(labelPrimitive(OPrime, "O′", 18, -14, p.fg, true));
      const oTrajectory = [];
      for (let i = 0; i <= 48; i += 1) {
        const a = -0.42 + 0.84 * i / 48;
        oTrajectory.push(rotateAroundAB([pivotX, -h, 0], a));
      }
      addArc(primitives, oTrajectory, p.s1, 1.5, 0.45, [3, 5]);
    }

    if (phase >= 3) {
      const effectiveStart = mode === "in" ? geometry.O : OPrime;
      primitives.push(linePrimitive(effectiveStart, geometry.C, p.s4, 5, 0.84));
      const midpoint = mul(add(effectiveStart, geometry.C), 0.5);
      primitives.push(labelPrimitive(midpoint, mode === "in" ? "OC" : "O′C", 24, -10, p.fg, true));
    }

    primitives.push(spherePrimitive(A, 0.055, p.fg));
    primitives.push(spherePrimitive(B, 0.055, p.fg));
    primitives.push(spherePrimitive(geometry.O, 0.075, p.s1));
    primitives.push(spherePrimitive(geometry.C, 0.15, p.s3));
    primitives.push(labelPrimitive(A, "A", -18, -18, p.fg, true));
    primitives.push(labelPrimitive(B, "B", 18, -18, p.fg, true));
    primitives.push(labelPrimitive(geometry.O, "O", 20, 2, p.fg, true));
    primitives.push(labelPrimitive(geometry.C, "C", 22, 4, p.fg, true));

    primitives.forEach((item) => {
      const points = item.kind === "line" ? [item.a, item.b] :
        item.kind === "poly" ? item.points :
        item.kind === "sphere" ? [item.center] : [item.point];
      item.depth = primitiveDepth(points, cam);
    });
    primitives.sort((a, b) => b.depth - a.depth);
    primitives.forEach((item) => drawPrimitive(item, cam));

    if (phase >= 1 && mode === "out") {
      const a = project(A, cam);
      const b = project(B, cam);
      if (a && b) {
        ctx.save();
        ctx.fillStyle = p.muted;
        ctx.font = "400 13px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("转轴 AB", (a.x + b.x) / 2, (a.y + b.y) / 2 - 12);
        ctx.restore();
      }
    }
  }

  function updateUi() {
    const inActive = mode === "in";
    inButton.setAttribute("aria-pressed", String(inActive));
    outButton.setAttribute("aria-pressed", String(!inActive));
    inButton.classList.toggle("btn-primary", inActive);
    outButton.classList.toggle("btn-primary", !inActive);
    modeLabel.textContent = inActive ? "纸面内摆动" : "垂直纸面摆动";
    noteLabel.textContent = notes[mode][phase];
    stepLabel.textContent = String(phase + 1) + " / 4";
    autoButton.textContent = autoRun ? "暂停自动" : "继续自动";
  }

  function setMode(nextMode) {
    mode = nextMode;
    phase = 0;
    lastPhaseChange = performance.now();
    updateUi();
  }

  function advance() {
    if (phase < 3) {
      phase += 1;
    } else {
      mode = mode === "in" ? "out" : "in";
      phase = 0;
    }
    lastPhaseChange = performance.now();
    updateUi();
  }

  function resetView() {
    yaw = 0.68;
    pitch = 0.18;
    radius = 7.6;
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    width = Math.max(320, rect.width);
    height = Math.max(300, rect.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  inButton.addEventListener("click", () => setMode("in"));
  outButton.addEventListener("click", () => setMode("out"));
  viewButton.addEventListener("click", resetView);
  nextButton.addEventListener("click", advance);
  autoButton.addEventListener("click", () => {
    autoRun = !autoRun;
    lastPhaseChange = performance.now();
    updateUi();
  });

  canvas.addEventListener("pointerdown", (event) => {
    dragging = true;
    pointerId = event.pointerId;
    lastX = event.clientX;
    lastY = event.clientY;
    canvas.setPointerCapture(pointerId);
  });

  canvas.addEventListener("pointermove", (event) => {
    if (!dragging || event.pointerId !== pointerId) return;
    const dx = event.clientX - lastX;
    const dy = event.clientY - lastY;
    yaw -= dx * 0.008;
    pitch = Math.max(-0.62, Math.min(0.72, pitch + dy * 0.006));
    lastX = event.clientX;
    lastY = event.clientY;
  });

  function endDrag(event) {
    if (event.pointerId !== pointerId) return;
    dragging = false;
    if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
    pointerId = null;
  }

  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    radius = Math.max(5.2, Math.min(11.5, radius * Math.exp(event.deltaY * 0.001)));
  }, { passive: false });

  const observer = new ResizeObserver(resize);
  observer.observe(stage);
  const themeObserver = new MutationObserver(() => {
    paletteCache = null;
  });
  themeObserver.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["class", "style", "data-theme"]
  });
  resize();
  updateUi();

  function tick(now) {
    const delta = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    motionTime += delta;
    if (autoRun && now - lastPhaseChange > 3300) advance();
    draw();
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>

  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide-initialization">(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
